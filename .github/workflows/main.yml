name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html www/
          cp manifest.json icon-192.png icon-512.png www/ 2>/dev/null || true
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Use fixed signing key (so updates keep your data)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: masrofy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
