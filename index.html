@media print{nav,.fab,header button,.np{display:none!important}body{background:#fff;color:#000}}

<script>

${P.k=='sel'?`<input type="month" value="${P.m}" onchange="P.m=this.value||P.m;render()">`:''}${P.k=='custom'?`<div class="row"><input type="date" value="${P.a}" onchange="P.a=this.value;render()"><input type="date" value="${P.b}" onchange="P.b=this.value;render()"></div>`:''}</div>`}
const pie=(l,mx,col)=>l.map(([k,v])=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${esc(k)}</span><b>${money(v)} (${mx?Math.round(v/mx*100):0}٪)</b></div><div class="bar"><i style="width:${mx?v/mx*100:0}%;${col?'background:'+col:''}"></i></div></div>`).join('')||'<p class="k">لا توجد بيانات</p>';
function home(){const[a,b]=range(),L=inR(S.tx,a,b),mo=T.slice(0,7),ML=inR(S.tx,mo+'-01',eom(mo)),TL=inR(S.tx,T,T);

return smartCard()+duesHTML()+filt()+`<div class="g">${C.map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v ${c[2]}">${money(c[1])}</div></div>`).join('')}</div>
${walletHTML()}<div class="card"><h3>أنا بصرف فلوسي في إيه؟</h3><p class="k">إجمالي المصروفات في الفترة: ${money(tE)}</p>${pie(cats,tE,'var(--ex)')}</div>
<div class="card"><h3>أكبر الأقسام والأقسام الفرعية</h3>${pie(grp(exL,t=>(t.cat||'—')+' ← '+(t.sub||'عام')).slice(0,6),tE,'var(--ex)')}</div>
<div class="card"><h3>الدخل حسب المصدر</h3>${pie(grp(L.filter(t=>t.type=='in'),t=>t.src||'—'),tI,'var(--in)')}</div>
<div class="card"><h3>الدخل مقابل المصروفات يوميًا</h3><div class="ch">${dd.map(x=>`<div><i style="height:${x[0]/mx*100}%;background:var(--in)"></i><i style="height:${x[1]/mx*100}%;background:var(--ex)"></i></div>`).join('')}</div><p class="k"><span class="in">■</span> دخل <span class="ex">■</span> مصروفات — صافي الفترة: <b>${money(tI-tE)}</b></p></div>
<div class="card"><h3>مقارنة الشهر الحالي بالأشهر السابقة</h3><table class="tb"><tr><th>الشهر</th><th>دخل</th><th>مصروفات</th><th>صافي</th></tr>${prev}</table></div>`}
function txList(){const[a,b]=range();let all=[...S.tx].sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.id-y.id),rb={},c=st0();all.forEach(t=>{c+=t.type=='in'?t.amount:-t.amount;rb[t.id]=c});
let l=inR(S.tx,a,b).filter(t=>(!F.t||t.type==F.t)&&(!F.c||t.cat==F.c||t.src==F.c)&&(!F.q||(t.desc+' '+t.notes).includes(F.q)));
l.sort((x,y)=>F.s=='d'?(y.date.localeCompare(x.date)||y.id-x.id):F.s=='da'?(x.date.localeCompare(y.date)||x.id-y.id):F.s=='h'?y.amount-x.amount:x.amount-y.amount);

l.forEach(t=>{if(t.date!=last&&F.s[0]=='d'){last=t.date;const dl=inR(S.tx,t.date,t.date);h+=`<div class="k" style="margin-top:12px"><b>${disp(t.date)}</b> — دخل ${money(sum(dl,'in'))} / مصروف ${money(sum(dl,'ex'))}</div>`}

function txv(){const cs=[...Object.keys(S.cats),...S.income];return filt()+`<div class="card np"><input placeholder="🔍 بحث في الوصف" value="${esc(F.q)}" oninput="F.q=this.value;$('#lst').innerHTML=txList()"><div class="row"><select onchange="F.t=this.value;render()"><option value="">الكل</option><option value="in" ${F.t=='in'?'selected':''}>دخل</option><option value="ex" ${F.t=='ex'?'selected':''}>مصروف</option></select>
<select onchange="F.c=this.value;render()"><option value="">كل التصنيفات والمصادر</option>${cs.map(c=>`<option ${F.c==c?'selected':''}>${esc(c)}</option>`).join('')}</select>
<select onchange="F.s=this.value;render()">${[['d','الأحدث'],['da','الأقدم'],['h','الأعلى مبلغًا'],['l','الأقل مبلغًا']].map(x=>`<option value="${x[0]}" ${F.s==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div></div><div class="card" id="lst">${txList()}</div>`}

function parse(s){s=s.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[أإآ]/g,'ا');const m=s.match(/\d+(?:[.,]\d+)?/),r={type:/قبضت|كسبت|استلمت|دخل|راتب|مرتب|اكرامي/.test(s)?'in':'ex',amount:m?m[0].replace(',','.'):'',date:/امبارح|امس/.test(s)?addD(T,-1):T,desc:s};

function openForm(id,pf){const e=typeof id=='number'?S.tx.find(t=>t.id==id):null,x=e||pf||{type:'ex',date:T};let ty=x.type;const o=document.createElement('div');o.className='ov';document.body.append(o);

function saveRev(){const L=IT.filter(t=>t.on&&t.k!='x');if(!L.length)return toast('علّم على اللي عايز تحفظه');
for(const t of L){const a=parseFloat(t.k=='gam'?t.amt:t.amount);if(!(a>0))return toast('المبلغ لازم يكون أكبر من صفر');if(t.k=='ex'&&!t.cat)return toast('اختر القسم');if(t.k=='in'&&!t.src)return toast('اختر مصدر الدخل');if((t.k=='me'||t.k=='owe')&&!t.who)return toast('اكتب اسم الشخص');if(t.k=='cash'&&!t.acct)return toast('اختر المحفظة');if(t.k=='gam'&&!(+t.every>0&&+t.members>0&&+t.cur>=1&&+t.turn>=1&&t.date0))return toast('كمّل بيانات الجمعية')}
const cash=[];L.forEach((t,j)=>{const id=Date.now()+j,a=parseFloat(t.k=='gam'?t.amt:t.amount);
if(t.k=='ex'||t.k=='in')S.tx.push({id,type:t.k,amount:Math.round(a*100)/100,cat:t.k=='ex'?t.cat:'',sub:t.k=='ex'&&(S.cats[t.cat]||[]).includes(t.sub)?t.sub:'',src:t.k=='in'?t.src:'',date:t.date||T,desc:t.desc||'',pay:t.pay||'كاش',notes:''});
else if(t.k=='cash')cash.push([t.acct,a]);else if(t.k=='gam')S.gam.push({id,name:t.name||'جمعية',amt:a,payout:+t.payout||a*t.members,every:+t.every,members:+t.members,cur:+t.cur,turn:+t.turn,date0:t.date0,paid:[],got:+t.turn<+t.cur});
else S.debts.push({id,kind:t.k,who:t.who,amount:a,due:t.due||'',paid:false})});cash.forEach(([ac,v])=>{S.starts[ac]=Math.round((v-(accB(ac)-S.starts[ac]))*100)/100});save();$('#rv').remove();render();toast('تم الحفظ ✓')}
const smartCard=()=>`<div class="card np"><b>اكتب كل حاجة بالعامية</b><textarea id="sm" rows="3" placeholder="مثال: يوم 9 في الشهر الحالي: دخلي 545 من الدليفري، 215 فرخة للبيت، 70 خضار، 20 علاج، ليا 560 برا، عليا جمعية 500 يوم 10، معايا 110 نقدية"></textarea><button class="b" onclick="smart($('#sm').value)">حلّل</button><p class="k">تحليل بقواعد محلية، وبتراجع النتيجة قبل ما يتحفظ أي حاجة.</p></div>`;
function duesHTML(){const L=[];S.gam.forEach(g=>{const d=gDue(g);if(d)L.push(['قسط جمعية '+g.name+' ('+money(g.amt)+')',d]);if(g.turn&&!g.got)L.push(['قبض جمعية '+g.name+' ('+money(g.payout||g.amt*g.members)+')',gDate(g,g.turn)])});S.debts.forEach(x=>{if(!x.paid&&x.due)L.push([(x.kind=='me'?'ليك عند ':'عليك لـ ')+x.who+' ('+money(x.amount)+')',x.due])});
const R=L.map(([t,d])=>[t,d,dff(d)]).filter(x=>x[2]<=7).sort((a,b)=>a[2]-b[2]);return R.length?`<div class="card"><h3>⏰ مستحقات قريبة</h3>${R.map(([t,d,n])=>`<div class="tx"><span>${esc(t)}</span><b class="${n<0?'ex':''}">${disp(d)} ${n<0?'(متأخر)':n==0?'(النهارده)':'(بعد '+n+' يوم)'}</b></div>`).join('')}</div>`:''}
const rowD=d=>`<div class="tx"><div><b>${d.kind=='me'?'ليا عند':'عليا لـ'} ${esc(d.who)}</b><div class="k">${d.due?'الموعد: '+disp(d.due):'بدون موعد'} ${d.paid?'· ✔ اتسدد':''}</div></div><div style="text-align:left"><b class="${d.kind=='me'?'in':'ex'}">${money(d.amount)}</b><div><button class="b2" onclick="payD(${d.id})">${d.paid?'↩':'✔ اتسدد'}</button> <button class="b2 d" onclick="delD(${d.id})">🗑</button></div></div></div>`;
const rowG=g=>{const r=gNext(g),nd=r?gDate(g,r):'',tt=g.turn?gDate(g,g.turn):'',po=g.payout||g.amt*g.members;return`<div class="card"><b>🤝 ${esc(g.name)}</b><div class="k">القسط ${money(g.amt)} كل ${g.every} يوم · الدور الحالي رقم ${g.cur} من ${g.members}</div><div class="k">المتبقي عليا: ${gLeft(g)} قسط = ${money(gLeft(g)*g.amt)}</div><div>${nd?`القسط الجاي: <b>${disp(nd)}</b> (دور رقم ${r})`:'✔ خلصت كل الأقساط'}</div>${tt?`<div class="k">دوري رقم ${g.turn}: ${disp(tt)} — القبض ${money(po)}${g.got?' ✔ اتقبض':''}</div>`:''}<div class="row">${nd?`<button class="b2" onclick="payG(${g.id})">دفعت القسط</button>`:''}${tt&&!g.got?`<button class="b2" onclick="gotG(${g.id})">قبضت الجمعية</button>`:''}<button class="b2 d" onclick="delG(${g.id})">🗑</button></div></div>`};
function dbtv(){const o=S.debts.filter(d=>!d.paid),me=sum2(o,'me'),ow=sum2(o,'owe')+S.gam.reduce((s,g)=>s+gLeft(g)*g.amt,0);
return smartCard()+`<div class="g"><div class="card"><div class="k">ليا عند الناس</div><div class="v in">${money(me)}</div></div><div class="card"><div class="k">عليا (ديون + أقساط جمعيات)</div><div class="v ex">${money(ow)}</div></div></div>`+duesHTML()+`<div class="card"><h3>الديون</h3>${S.debts.map(rowD).join('')||'<p class="k">لا يوجد</p>'}<p class="k">تسجيل السداد هنا للمتابعة فقط ولا يغيّر رصيدك. سجّل الدخل أو المصروف الفعلي من زر +.</p></div><h3>الجمعيات</h3>${S.gam.map(rowG).join('')||'<p class="k">لا يوجد</p>'}`}
const payD=id=>{const d=S.debts.find(x=>x.id==id);d.paid=!d.paid;save();render()};
const delD=id=>dlg('حذف هذا الدين؟',null,()=>{S.debts=S.debts.filter(x=>x.id!=id);save();render()});
const delG=id=>dlg('حذف هذه الجمعية؟ المعاملات المسجلة لن تُحذف.',null,()=>{S.gam=S.gam.filter(x=>x.id!=id);save();render()});
function payG(id){const g=S.gam.find(x=>x.id==id),r=gNext(g);dlg('تسجيل قسط '+g.name+' (دور رقم '+r+') بمبلغ '+money(g.amt)+' كمصروف النهارده؟',null,()=>{S.tx.push({id:Date.now(),type:'ex',amount:g.amt,cat:'الأقساط والديون',sub:'',src:'',date:T,desc:'قسط جمعية '+g.name+' دور '+r,pay:'كاش',notes:''});g.paid.push(r);save();render();toast('تم ✓')})}
function gotG(id){const g=S.gam.find(x=>x.id==id),p=g.payout||g.amt*g.members;dlg('تسجيل قبض الجمعية '+money(p)+' كدخل النهارده؟',null,()=>{S.tx.push({id:Date.now(),type:'in',amount:p,cat:'',sub:'',src:'دخل إضافي',date:T,desc:'قبض جمعية '+g.name,pay:'كاش',notes:''});g.got=true;save();render();toast('تم ✓')})}
function mig(){S.starts=Object.assign({},...PAY.map(a=>({[a]:0})),S.starts||{});if(S.start){S.starts['كاش']+=S.start;S.start=0}
S.gam=(S.gam||[]).map(g=>g.members?g:{id:g.id,name:g.name,amt:g.amt,payout:g.amt*g.months,every:30,members:g.months,cur:1,turn:g.turn||0,date0:g.start+'-'+p2(g.day),paid:(g.paid||[]).map(m=>(+m.slice(0,4)-+g.start.slice(0,4))*12+(+m.slice(5)-+g.start.slice(5))+1),got:!!g.got})}
const accB=a=>(+S.starts[a]||0)+S.tx.filter(t=>t.pay==a).reduce((s,t)=>s+(t.type=='in'?t.amount:-t.amount),0);
const walletHTML=()=>{const o=PAY.map(a=>[a,accB(a)]),oth=bal()-o.reduce((s,x)=>s+x[1],0);if(Math.abs(oth)>.005)o.push(['أخرى',oth]);return`<div class="card"><h3>فلوسي فين؟</h3>${o.map(([a,v])=>`<div class="tx"><span>${a=='كاش'?'💵 كاش (نقدي)':a=='فودافون كاش'?'📱 فودافون كاش':a=='انستاباي'?'🏦 انستاباي':esc(a)}</span><b class="${v<0?'ex':''}">${money(v)}</b></div>`).join('')}<div class="tx"><b>الإجمالي</b><b>${money(bal())}</b></div></div>`};
function render(){$('#v').innerHTML={home,tx:txv,rep:repv,dbt:dbtv,set:setv}[tab]()}
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
